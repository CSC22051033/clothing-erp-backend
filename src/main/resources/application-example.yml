server:
    port: 8080
    servlet:
        context-path: /api

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/clothing_erp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: root
        password: your_mysql_password   # 请替换为你的真实密码
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQL8Dialect
                format_sql: true

logging:
    level:
        com.erp: DEBUG